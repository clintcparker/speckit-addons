name: validate

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*-v*"]
  schedule:
    # Weekly, to catch a deleted tag or a botched release after the fact.
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml pytest

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Validate catalogs against add-ons on disk
        run: python scripts/validate_catalog.py

      - name: Verify pinned URLs resolve
        # Skipped on pull requests by design: a release PR bumps the version
        # before its tag exists, so this check would fail every release PR by
        # construction. On main and on the weekly schedule it catches a deleted
        # tag or a release that was committed but never tagged.
        if: github.event_name != 'pull_request'
        run: python scripts/validate_catalog.py --check-urls
