schema_version: "1.0"
workflow:
  id: "send-it"
  name: "Spec to PR, unattended"
  version: "0.5.0"
  author: "clintcparker"
  description: "worktree → specify → plan → tasks → screenshots → implement → screenshots → ship; no gates, ends in an open PR with before/after UI screenshots. Requires the `worktrees`, `screenshots` and `ship` extensions."

requires:
  # Same floor as yolo: 0.8.12 is the first release with engine-side resolution
  # of ``integration: "auto"`` (spec-kit #2421). Older versions treat "auto" as
  # a literal integration key and fail at dispatch.
  #
  # The `screenshots` extension is a hard dependency -- the two capture steps
  # fail at dispatch without it -- and as of 0.3.0 so is `worktrees`, for the
  # first step. Neither can be declared here: `requires` recognizes only
  # speckit_version and integrations, and an unknown key is a validation
  # error. See this workflow's README.
  speckit_version: ">=0.8.12"
  integrations:
    # Advisory compatibility hint, not a closed set -- see workflows/yolo.
    any:
      - "claude"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use (e.g. claude, copilot, gemini; 'auto' uses the project's initialized integration)"
  target_branch:
    type: string
    default: "main"
    prompt: "Branch the pull request should target"

steps:
  # Worktree isolation is a STEP, not an inherited hook side-effect.
  #
  # The global before_specify hook in .specify/extensions.yml only fires when a run
  # actually starts at specify. A resumed run, or a fix-up run over a feature that was
  # already specified, enters at a later step, never triggers the hook, and executes
  # entirely in the primary checkout. That is not recoverable after the fact unless the
  # primary happens to be clean: create-worktree.sh's header states the invariant — a
  # branch can live in exactly one worktree, so a `git checkout -b` in the primary
  # makes `git worktree add` impossible for that same branch until the primary moves
  # off it.
  #
  # This step is idempotent (see speckit.worktrees.create Outline step 0). When the
  # before_specify hook has already fired, it finds the session inside a worktree and
  # no-ops, so declaring both costs nothing.
  #
  # Where the later steps actually run depends on the `session` field this step reports,
  # and in an unattended run it is usually NOT the worktree. Moving the session needs the
  # EnterWorktree tool, which requires interactive approval that nobody is here to give,
  # so the normal outcome is worktree_isolation=created with session=primary: the branch
  # lives in its worktree, the session's working directory is still the primary checkout,
  # and correctness rides on the SPECIFY_INIT_DIR / SPECIFY_FEATURE_DIRECTORY overrides
  # this step emits. Every later step must honor them; nothing enforces that, which is why
  # ship surfaces session=primary in the pull request description. Do not add a step that
  # assumes the primary checkout is on the feature branch either.
  - id: worktree
    command: speckit.worktrees.create
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        UNATTENDED RUN — no user is present; never prompt and never ask which layout.

        Ensure this session is inside a feature worktree before any later step touches
        the repo. Follow the command's Outline step 0 case detection: no-op if already
        isolated; use the existing BRANCH NAME (never --from-description) if the primary
        checkout is on a feature branch; use --from-description "{{ inputs.spec }}" only
        when the primary is on the base ref with no feature branch yet.

        If the feature branch is already checked out in the primary, take the recovery
        path only when `git status --porcelain` and `git stash list` are BOTH empty:
        move the primary to the base ref, attach the worktree, enter it, and report
        worktree_isolation=recovered naming the base ref the primary now sits on. If
        either is non-empty, do NOT force it and do NOT move the primary — report
        worktree_isolation=failed with the branch name and continue the workflow in
        place.

        EnterWorktree needs interactive approval and nobody is here to give it, so expect
        the call to be refused and expect session=primary. That is the normal outcome of
        an unattended run, not a failure — but do NOT let the spec land in the primary
        checkout because of it. Emit SPECIFY_INIT_DIR and SPECIFY_FEATURE_DIRECTORY in the
        fields block exactly as Outline step 3 requires, and export SPECIFY_INIT_DIR for
        every .specify/scripts/** invocation from here to the end of the run.

        REPORT, DO NOT REMEDY. Creating the branch inside its worktree is this step's whole
        mandate. If the resolved base ref lags a local branch of the same name, or the spec
        description names gitignored or untracked paths that cannot exist in a fresh
        worktree, NAME them and move on: no merge, rebase, cherry-pick, reset or pull to
        close the gap, and no copying untracked files across. "Never prompt" is not licence
        to act unilaterally.

        PIN THE FEATURE — take Outline step 4 on every path out of this command, including
        worktree_isolation=failed: write the run context with write-run-context.sh and
        report run_context=<path> in the fields block. Every later step of this workflow
        resolves FEATURE_DIR from that file and has nothing else to go on. If the script
        exits 3, another unattended run owns the pointer in this primary checkout — report
        run_context=collision naming both branches, and do NOT pass --force.

        Carry worktree_isolation, session AND run_context forward, so the ship step can
        surface a recovered, failed, degraded, or collided outcome in the pull request
        description.

  # Every step below re-states the same FEATURE IDENTITY block. That is not an oversight:
  # the workflow engine has no step-output templating, so a step receives nothing but its
  # own args — not the worktree step's report, not the previous step's output. Each one has
  # to be told, in its own args, where to find the run context. See issue #1.
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        {{ inputs.spec }}

        --- RUN CONTROL (not part of the feature description above) ---

        FEATURE IDENTITY — resolve it from the run context, not from the repo. The worktree
        step pinned this run's feature to `.specify/run-context.json`; look for it under
        $SPECIFY_INIT_DIR first, then in the current directory, then in the primary
        checkout. Take `branch`, `feature_dir` and `worktree_path` from it, and export
        SPECIFY_INIT_DIR=<worktree_path> (when non-empty) and
        SPECIFY_FEATURE_DIRECTORY=<feature_dir> for every `.specify/scripts/**` invocation
        this step makes.

        PRIOR WORK — before running the spec command, check whether `feature_dir` already
        exists and contains a spec document. If it does, this is a resumed run: adopt the
        existing spec without regenerating it, note the adoption in the step output, and
        continue. Do not mint a second branch and do not ask. If the existing spec is
        incomplete, extend it in place and record what was added. Only run the full spec
        command when `feature_dir` does not yet exist or is empty.

        Do not mint a new feature number and do not derive one from `specs/`: the branch in
        the run context is this run's feature, whatever the tree the session is standing in
        looks like.

        If a script resolves a feature the run context does not name, it has found the wrong
        one: FAIL THIS STEP LOUDLY, naming both, and do not adopt it. If no run context file
        can be found at all, fail the same way rather than guessing.

        UNATTENDED RUN — no user is present; never pause for input and never ask a question.
        Make every judgment call yourself, record it and its reasoning in the artifact, and
        flag it as an open decision the ship step should surface in the PR description.

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        {{ inputs.spec }}

        --- RUN CONTROL (not part of the feature description above) ---

        FEATURE IDENTITY — resolve it from the run context, not from the repo. The worktree
        step pinned this run's feature to `.specify/run-context.json`; look for it under
        $SPECIFY_INIT_DIR first, then in the current directory, then in the primary
        checkout. Take `branch`, `feature_dir` and `worktree_path` from it, and export
        SPECIFY_INIT_DIR=<worktree_path> (when non-empty) and
        SPECIFY_FEATURE_DIRECTORY=<feature_dir> for every `.specify/scripts/**` invocation
        this step makes.

        Never infer the feature from the current branch, from `.specify/feature.json`, or
        from the newest directory under `specs/`. Right after a merge all three name the
        PREVIOUS feature, and this run's session is usually standing in the primary
        checkout, where that is exactly what they name. A helper script exiting 0 is not
        evidence it found the right feature: `setup-plan.sh` exits 0 on the wrong one and
        plants a template `plan.md` there.

        If a script resolves a feature the run context does not name, it has found the wrong
        one: FAIL THIS STEP LOUDLY, naming both the resolved feature and the pinned one, and
        do not adopt it. If no run context file can be found at all, fail the same way
        rather than guessing.

        PRIOR WORK — if `feature_dir` already contains a completed `plan.md` from a prior
        run, adopt it without regenerating. Note the adoption in the step output and
        continue. Only run the full plan command when `plan.md` does not exist or is empty.

        UNATTENDED RUN — no user is present; never pause for input and never ask a question.
        Make every judgment call yourself, record it and its reasoning in the artifact, and
        flag it as an open decision the ship step should surface in the PR description.

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        {{ inputs.spec }}

        --- RUN CONTROL (not part of the feature description above) ---

        FEATURE IDENTITY — resolve it from the run context, not from the repo. The worktree
        step pinned this run's feature to `.specify/run-context.json`; look for it under
        $SPECIFY_INIT_DIR first, then in the current directory, then in the primary
        checkout. Take `branch`, `feature_dir` and `worktree_path` from it, and export
        SPECIFY_INIT_DIR=<worktree_path> (when non-empty) and
        SPECIFY_FEATURE_DIRECTORY=<feature_dir> for every `.specify/scripts/**` invocation
        this step makes.

        Never infer the feature from the current branch, from `.specify/feature.json`, or
        from the newest directory under `specs/`. Right after a merge all three name the
        PREVIOUS feature, and this run's session is usually standing in the primary
        checkout, where that is exactly what they name. A helper script exiting 0 is not
        evidence it found the right feature.

        If a script resolves a feature the run context does not name, it has found the wrong
        one: FAIL THIS STEP LOUDLY, naming both the resolved feature and the pinned one, and
        do not adopt it. If no run context file can be found at all, fail the same way
        rather than guessing.

        PRIOR WORK — if `feature_dir` already contains a completed `tasks.md` from a prior
        run, adopt it without regenerating. Note the adoption in the step output and
        continue. Only run the full tasks command when `tasks.md` does not exist or is empty.

        UNATTENDED RUN — no user is present; never pause for input and never ask a question.
        Make every judgment call yourself, record it and its reasoning in the artifact, and
        flag it as an open decision the ship step should surface in the PR description.

  # Baseline screenshots MUST run before implement: at this point the worktree
  # differs from the target branch only by spec documents, so the app still
  # renders exactly what the PR's base commit would. The command self-skips
  # (writing screenshots/SKIPPED.md) when the spec has no UI surface.
  # Provided by the `screenshots` extension.
  - id: screenshots-before
    command: speckit.screenshots.capture
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        mode: before. Target branch: {{ inputs.target_branch }}.

        FEATURE IDENTITY — resolve it from the run context, not from the repo. The
        worktree step pinned this run's feature to `.specify/run-context.json`; look for
        it under $SPECIFY_INIT_DIR first, then in the current directory, then in the
        primary checkout. Take `branch`, `feature_dir` and `worktree_path` from it, and
        export SPECIFY_INIT_DIR=<worktree_path> (when non-empty) and
        SPECIFY_FEATURE_DIRECTORY=<feature_dir> for every `.specify/scripts/**`
        invocation this step makes. The manifest and the images belong under that
        `feature_dir`, and the app to build and drive is the one in `worktree_path`.

        Never infer the feature from the current branch, from `.specify/feature.json`,
        or from the newest directory under `specs/` — right after a merge all three name
        the PREVIOUS feature, and this run's session is usually standing in the primary
        checkout, where that is exactly what they name. If anything resolves a feature
        the run context does not name, FAIL THIS STEP LOUDLY naming both rather than
        capturing the wrong tree. If no run context file can be found at all, fail the
        same way rather than guessing.

        UNATTENDED RUN — no user is present. Make every judgement call
        (UI-relevance, which targets, what seed data) yourself and record it in
        the manifest instead of asking. If the app profile is still
        unconfigured, derive it and write it back rather than stopping. A
        failure to build or start the app here means the *base* branch is
        broken: report it and continue the workflow without baseline
        screenshots rather than aborting.

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        {{ inputs.spec }}

        --- RUN CONTROL (not part of the feature description above) ---

        FEATURE IDENTITY — resolve it from the run context, not from the repo. The worktree
        step pinned this run's feature to `.specify/run-context.json`; look for it under
        $SPECIFY_INIT_DIR first, then in the current directory, then in the primary
        checkout. Take `branch`, `feature_dir` and `worktree_path` from it, and export
        SPECIFY_INIT_DIR=<worktree_path> (when non-empty) and
        SPECIFY_FEATURE_DIRECTORY=<feature_dir> for every `.specify/scripts/**` invocation
        this step makes.

        Every file this step writes belongs in the tree named by `worktree_path`. Never
        infer the feature from the current branch, from `.specify/feature.json`, or from the
        newest directory under `specs/`; right after a merge all three name the PREVIOUS
        feature, and implementing against those is how a run edits the wrong tree.

        If a script resolves a feature the run context does not name, it has found the wrong
        one: FAIL THIS STEP LOUDLY, naming both the resolved feature and the pinned one, and
        do not adopt it. If no run context file can be found at all, fail the same way
        rather than guessing.

        PRIOR WORK — if `worktree_path` already contains uncommitted or committed changes
        from a prior run, adopt them: rebase onto the current base ref if needed, extend or
        complete the implementation rather than rewriting it, and extend the tests rather
        than replacing them. Record what was inherited and what was added. Do not ask.

        UNATTENDED RUN — no user is present; never pause for input and never ask a question.
        Make every judgment call yourself, record it and its reasoning in the artifact, and
        flag it as an open decision the ship step should surface in the PR description.

  - id: screenshots-after
    command: speckit.screenshots.capture
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        mode: after. Target branch: {{ inputs.target_branch }}.

        FEATURE IDENTITY — resolve it from the run context, not from the repo, exactly as
        the before pass did: read `.specify/run-context.json` ($SPECIFY_INIT_DIR first,
        then the current directory, then the primary checkout), take `branch`,
        `feature_dir` and `worktree_path` from it, and export SPECIFY_INIT_DIR and
        SPECIFY_FEATURE_DIRECTORY from those values. The manifest to reuse is the one
        under that `feature_dir`, and the app to build and drive is the one in
        `worktree_path`. A pair of captures taken from two different features is worse
        than no pair at all, because it looks like evidence. If anything resolves a
        feature the run context does not name, or no run context can be found, FAIL THIS
        STEP LOUDLY naming what you found.

        UNATTENDED RUN — no user is present. Reuse the manifest written by the
        before pass (same targets, same viewports, same app state if it
        survived) so the pair is comparable. If the app no longer builds or
        starts, that is an implementation defect: capture nothing, write the
        failure into the manifest notes, and let the workflow continue so ship
        can surface it in the pull request instead of silently dropping it.

  # speckit.ship.run is provided by the `ship` extension, not by core Spec Kit.
  # Its command reads $ARGUMENTS before anything else ("You MUST consider the
  # user input before proceeding"), which is the designed lever for turning a
  # safe-by-default interactive command into an unattended one.
  - id: ship
    command: speckit.ship.run
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        Target branch: {{ inputs.target_branch }}.

        FEATURE IDENTITY — resolve it from the run context, not from the repo. This is the
        step that drifted: read `.specify/run-context.json` ($SPECIFY_INIT_DIR first, then
        the current directory, then the primary checkout) and take `branch`, `feature_dir`
        and `worktree_path` from it. The branch to push is `branch`; the tasks, reviews,
        QA reports and screenshots to read are under `feature_dir`; the tree to commit
        from is `worktree_path`. Export SPECIFY_INIT_DIR and SPECIFY_FEATURE_DIRECTORY
        from those values for every `.specify/scripts/**` invocation.

        Never infer the feature from the current branch, from `.specify/feature.json`, or
        from the newest directory under `specs/`. This run's session is usually standing
        in the primary checkout, which after a merge is on the target branch and points at
        the feature that just shipped — opening a pull request for that one is exactly the
        failure this instruction exists to prevent. If anything resolves a feature the run
        context does not name, or no run context can be found, STOP: do not commit, do not
        push, do not open a pull request. Report what you found and what was pinned.

        UNATTENDED RUN — no user is present and no prompt can be answered.
        Treat every confirmation this command would normally ask as answered
        YES and continue without waiting: the readiness summary, the
        rebase/merge confirmation, the push confirmation, the CHANGELOG
        prepend confirmation, and the pull request creation confirmation.

        Before the working-tree pre-flight check, commit every uncommitted
        change with a descriptive conventional-commit message instead of
        prompting to commit or stash.

        WORKTREE ISOLATION — the worktree step reported three fields; carry all
        of them through. If the run reported worktree_isolation=failed, say so plainly
        near the TOP of the pull request description: the run executed in the
        primary checkout rather than an isolated worktree, and name the branch.
        If it reported worktree_isolation=recovered, note that the primary
        checkout was moved off the feature branch to the base ref so the
        worktree could be attached — the user will want to know their working
        directory changed under them. If it reported session=primary for any
        reason other than enter_worktree being false, note that too: the branch
        is in its worktree but the agent session ran from the primary checkout
        via SPECIFY_INIT_DIR, so every write depended on that override holding
        rather than on the working directory. And if it reported
        run_context=collision, put that near the TOP as well: a second unattended
        run owns the run context pointer in the primary checkout, so both runs'
        later steps were one unexported environment variable away from building
        somebody else's feature. Otherwise no mention is needed.

        Also carry forward anything the worktree step reported under Outline
        step 5 — a base ref behind its local counterpart, or feature inputs that
        are gitignored and therefore absent from the worktree. Both change how
        this pull request should be read: the first means the branch may not
        contain commits the reviewer has locally, the second means the feature
        was built against files no reviewer can see.

        If any tasks in tasks.md are still incomplete, do not stop — proceed
        and list the incomplete tasks in the pull request description.

        Prefer rebase over merge when synchronizing with the target branch.

        Do not block on CI. If gh is unavailable, if no CI run exists yet for
        the branch, or if a run is still in progress, proceed and record the
        CI status in the pull request description rather than waiting. If CI
        has already failed, still open the pull request and call the failure
        out prominently in the description.

        The one legitimate stop is a rebase conflict that cannot be resolved
        trivially: leave the branch as it is for manual resolution and report
        what happened. Never force-push.

        SCREENSHOTS SECTION — after pushing the branch and before creating the
        pull request, check FEATURE_DIR/screenshots/. If it contains images,
        add a "## Screenshots" section to the PR description: one markdown
        table per captured target with Before and After columns, one row per
        viewport.

        Read repository visibility with
        `gh repo view --json visibility,nameWithOwner`. When the repository is
        PRIVATE, raw.githubusercontent.com URLs do NOT render for reviewers —
        embed each image as
        https://github.com/{owner}/{repo}/blob/{head_sha}/{path}?raw=true.
        When it is PUBLIC, either form renders; prefer
        https://raw.githubusercontent.com/{owner}/{repo}/{head_sha}/{path}.
        If gh cannot report visibility, assume PRIVATE and use the blob form —
        it renders in both cases.

        Always pin the pushed head commit SHA, never the branch name, which
        dies when the branch is deleted after merge. If a side is missing (no
        baseline, or the after pass recorded a failure in the manifest notes),
        say so in that table cell and surface any manifest failure notes
        prominently at the top of the section. If screenshots/SKIPPED.md exists
        instead, add the single line "No UI changes — screenshots skipped."
        Verify the screenshot commits are actually part of the pushed head
        before linking.
